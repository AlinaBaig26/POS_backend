services:
  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - product_service
      - supplier_service
      - customer_service
      - order_service
      - purchase_service

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  auth_service:
    build: ./auth_service
    container_name: auth_service
    expose:
      - "8001"
    depends_on:
      - rabbitmq

  product_service:
    build: ./product_service
    container_name: product_service
    expose:
      - "8002"
    depends_on:
      - rabbitmq

  product_rpc_worker:
    build: ./product_service
    container_name: product_rpc_worker
    command: python -m product_app.rpc_server.rpc_server
    depends_on:
      - rabbitmq

  supplier_service:
    build: ./supplier_service
    container_name: supplier_service
    expose:
      - "8003"
    depends_on:
      - rabbitmq

  supplier_rpc_worker:
    build: ./supplier_service
    container_name: supplier_rpc_worker
    command: python -m supplier_app.rpc_server.rpc_server
    depends_on:
      - rabbitmq

  customer_service:
    build: ./customer_service
    container_name: customer_service
    expose:
      - "8004"
    depends_on:
      - rabbitmq

  customer_rpc_worker:
    build: ./customer_service
    container_name: customer_rpc_worker
    command: python -m customer_app.rpc_server.rpc_server
    depends_on:
      - rabbitmq

  order_service:
    build: ./order_service
    container_name: order_service
    expose:
      - "8005"
    depends_on:
      - rabbitmq

  purchase_service:
    build: ./purchase_service
    container_name: purchase_service
    expose:
      - "8006"
    depends_on:
      - rabbitmq